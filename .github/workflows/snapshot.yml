name: refresh-snapshot
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        run: python3 --version

      - name: Crawl and rebuild snapshot (Python 首选)
        run: python3 crawler/build_snapshot.py

      - name: Crawl and rebuild snapshot (Node 回退)
        if: failure()
        run: node scripts/snapshot.mjs

      - name: Build course stats (Python)
        run: python3 crawler/analysis.py

      - name: Split timetable by term (加速课程表加载)
        run: python3 crawler/split_snapshot.py

      - name: Crawl Tieba sentiment (尽力而为，反爬失败不阻塞)
        continue-on-error: true
        run: |
          python3 crawler/tieba.py || node scripts/tieba.mjs || echo "tieba unavailable (non-fatal)"

      - name: Validate snapshot (Python)
        run: python3 crawler/validate.py

      - name: Unit tests (Python)
        run: python3 -m unittest discover -s tests

      - name: Compute data diff
        id: diff
        run: |
          python3 crawler/diff.py > data_diff.txt
          echo "summary=$(cat data_diff.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "qdu-nav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json public/data/course_stats.json public/data/tieba_stats.json public/data/timetable_meta.json public/data/terms
          if git diff --cached --quiet; then
            echo "snapshot unchanged, skip commit"
            exit 0
          fi
          git commit -m "data: refresh snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)" -m "${{ steps.diff.outputs.summary }}"
          # 复盘 #221：原实现只有一次 git push，遇到 GitHub 临时 5xx 或远端在抓取期间
          # 被 deploy/手动提交推进（non-fast-forward）就直接整步失败。显式推 HEAD:main，
          # 失败则 rebase 到最新 main 后重试，最多 3 次，并把状态打到日志便于排查。
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "snapshot refreshed and pushed (attempt $i); deploy workflow will rebuild the site"
              exit 0
            fi
            echo "::warning::push attempt $i failed; rebasing onto latest main and retrying"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          echo "::error::snapshot push failed after 3 attempts"
          git status
          git log --oneline -3
          exit 1